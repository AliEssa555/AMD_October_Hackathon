[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo_der"
version = "0.1.0"
description = "YOLO-DER: Dynamic Enhancement Routing for low-light vehicle detection, trained on AMD MI300X"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "project owner" }]
# Runtime deps kept deliberately small: anything needed to *import* yolo_der.
# Heavy training/cloud deps live in the [train] extra so CI stays fast.
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# CI + local development. Note: torch/ultralytics are NOT here; CI installs the
# CPU torch wheel from download.pytorch.org first (see .github/workflows/ci.yml),
# then `pip install -e ".[dev]"`.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "opencv-python-headless>=4.9",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.13",
]
# Everything needed to actually train / track / version data.
train = [
  "ultralytics==8.3.*",
  "mlflow==3.*",
  "dvc[s3]>=3.50",
  "boto3>=1.34",
  "opencv-python-headless>=4.9",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "roboflow>=1.1",
]

[project.urls]
Homepage = "https://github.com/OWNER/yolo-der"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# docs/ holds the verbatim project spec; its fenced code blocks are quotations, not source.
extend-exclude = ["notebooks", "data", "runs", "docs"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "D",    # pydocstyle -- docstrings cite the paper equations (spec 5)
  "ANN",  # type hints on public functions
]
ignore = [
  "D105",   # magic method docstrings
  "D107",   # __init__ docstring (documented on the class)
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN003", # **kwargs annotations
  "ANN401", # Any
  "B008",   # function call in default arg (argparse/typer patterns)
  "E741",   # ambiguous name 'l' -- used for layer indices in paper notation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN"]
"src/yolo_der/**/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: deselect with -m 'not slow' (export / full-model tests)",
  "gpu: requires a GPU",
  "net: requires network access",
]

[tool.coverage.run]
source = ["src/yolo_der"]
