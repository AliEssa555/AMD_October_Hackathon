#cloud-config
# First-boot configuration for the yolo-der-hub CPU Droplet (spec 8.4).
# No secrets here: /opt/hub/.env is pushed separately by infra/hub/deploy_hub.sh.
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - sqlite3
  - unattended-upgrades
  - rsync

write_files:
  # 1 GB of swap: the 2 GB box builds the MLflow image and runs Node alongside it.
  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=10

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /opt/hub/README.md
    content: |
      Hub services live here. Deploy with infra/hub/deploy_hub.sh from the laptop.
      Secrets are in /opt/hub/.env (mode 600) and are never committed.

runcmd:
  # --- swap ---------------------------------------------------------------
  - [bash, -lc, "fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile"]
  - [bash, -lc, "echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - [bash, -lc, "sysctl --system"]

  # --- Docker Engine + compose plugin from Docker's own apt repo ----------
  - [bash, -lc, "install -m 0755 -d /etc/apt/keyrings"]
  - [bash, -lc, "curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc"]
  - [bash, -lc, "echo \"deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable\" > /etc/apt/sources.list.d/docker.list"]
  - [bash, -lc, "apt-get update -y"]
  - [bash, -lc, "apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"]
  - [bash, -lc, "systemctl enable --now docker"]

  # --- cron: back up the MLflow sqlite db to Spaces every 6 h -------------
  - [bash, -lc, "echo '0 */6 * * * root bash /opt/hub/backup_mlflow.sh >> /var/log/mlflow-backup.log 2>&1' > /etc/cron.d/mlflow-backup && chmod 0644 /etc/cron.d/mlflow-backup"]

  - [bash, -lc, "docker --version && docker compose version"]
  - [bash, -lc, "touch /opt/hub/.cloud-init-done"]

final_message: "yolo-der-hub ready after $UPTIME s. Next: infra/hub/deploy_hub.sh"
